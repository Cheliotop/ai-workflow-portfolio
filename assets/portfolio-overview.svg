<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Sergio Hoeckh proof of work map</title><desc id="desc">Two shipped client systems demonstrate AI-assisted product operations and field-software delivery with verification and handoff.</desc><defs><pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1e293b"/></pattern></defs><rect width="1200" height="430" rx="24" fill="#020617"/><rect width="1200" height="430" rx="24" fill="url(#g)"/><text x="56" y="64" fill="#f8fafc" font-family="Arial" font-size="28" font-weight="700">Proof of work · AI workflow operations</text><text x="56" y="94" fill="#94a3b8" font-family="Arial" font-size="15">From unclear process to structured workflow, verification and usable handoff</text><g font-family="Arial"><g fill="#0f172a" stroke-width="2"><rect x="70" y="150" width="500" height="200" rx="18" stroke="#34d399"/><rect x="630" y="150" width="500" height="200" rx="18" stroke="#a78bfa"/></g><g font-size="21" font-weight="700"><text x="102" y="195" fill="#6ee7b7">Multi-Language Teaching Platform</text><text x="662" y="195" fill="#c4b5fd">PHC Drilling Monitoring System</text></g><g fill="#cbd5e1" font-size="15"><text x="102" y="232">• RLS on 25 of 25 tables</text><text x="102" y="262">• Zero security-advisor findings</text><text x="102" y="292">• 140-lesson A1–B2 curriculum spine</text><text x="102" y="322">• One engine serving 20 languages</text><text x="662" y="232">• Offline-capable field app for drilling crews</text><text x="662" y="262">• 9 automated end-to-end test flows</text><text x="662" y="292">• 5 signed releases in 9 days</text><text x="662" y="322">• Nightly verified production backups</text></g></g><text x="600" y="398" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="14">Positioning: practical workflow direction, AI-assisted implementation, documentation, QA and verification.</text></svg>
